<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ML Learn 用户登录">
    <title>登录 - ML Learn</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="account.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="../index.html" aria-label="返回首页">
                <span class="brand-mark">ML</span>
                <span>ML Learn</span>
            </a>
            <nav class="main-nav" aria-label="主导航">
                <a href="../index.html">首页</a>
                <a href="../index.html#courses">课程</a>
                <a href="../index.html#practice">互动练习</a>
                <a href="../index.html#about">关于我们</a>
            </nav>
            <div class="account-actions">
                <a class="button button-secondary" href="login.html">登录</a>
                <a class="button button-primary" href="register.html">注册</a>
                <a class="account-user" id="account-user" href="profile.html" data-profile-href="profile.html" hidden>我的账号</a>
            </div>
        </div>
    </header>

    <main class="account-page">
        <div class="account-shell">
            <section class="account-card" aria-labelledby="login-title">
                <p class="eyebrow">欢迎回来</p>
                <h1 id="login-title">登录 ML Learn</h1>
                <p class="account-intro">登录后可以保存个人资料和学习记录。</p>

                <form class="auth-form" id="login-form" novalidate>
                    <div class="form-group">
                        <label for="login-username">用户名 <span class="required" aria-hidden="true">*</span></label>
                        <input class="form-control" id="login-username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">密码 <span class="required" aria-hidden="true">*</span></label>
                        <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
                    </div>

                    <p class="auth-message" id="login-message" role="status" aria-live="polite"></p>

                    <div class="auth-actions">
                        <button class="button button-primary button-large" type="submit">登录</button>
                    </div>

                    <p class="auth-switch">还没有账号？<a href="register.html">立即注册</a></p>
                </form>

                <p class="back-home"><a href="../index.html">返回网站首页</a></p>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div>
                <a class="brand footer-brand" href="../index.html">
                    <span class="brand-mark">ML</span>
                    <span>ML Learn</span>
                </a>
                <p>让机器学习变得清晰、直观、有趣。</p>
            </div>
            <div class="footer-links">
                <a href="../index.html#home">首页</a>
                <a href="../index.html#courses">课程</a>
                <a href="../index.html#about">关于</a>
            </div>
            <p class="copyright">© 2026 ML Learn</p>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script>
        (function () {
            const form = document.getElementById("login-form");
            const message = document.getElementById("login-message");

            const params = new URLSearchParams(window.location.search);
            if (params.get("registered") === "1") {
                message.classList.add("is-success");
                message.textContent = "注册成功，请使用刚才的信息登录。";
            }

            form.addEventListener("submit", function (event) {
                event.preventDefault();
                message.className = "auth-message";
                message.textContent = "";

                const username = document.getElementById("login-username").value.trim();
                const password = document.getElementById("login-password").value;

                if (!username || !password) {
                    message.classList.add("is-error");
                    message.textContent = "请填写用户名和密码。";
                    return;
                }

                const result = window.MLAuth.login(username, password);
                if (!result.ok) {
                    message.classList.add("is-error");
                    message.textContent = result.message;
                    return;
                }

                message.classList.add("is-success");
                message.textContent = "登录成功，正在跳转首页...";
                window.setTimeout(function () {
                    window.location.href = "../index.html";
                }, 600);
            });
        })();
    </script>
</body>
</html>
