<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ML Learn 机器学习基础知识树" />
    <title>知识树 - ML Learn</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="../courses.css" />
    <link rel="stylesheet" href="basics.css" />
    <link rel="stylesheet" href="tree.css" />
  </head>
  <body class="knowledge-tree-page">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="../../index.html" aria-label="返回首页">
          <span class="brand-mark">ML</span>
          <span>ML Learn</span>
        </a>
        <nav class="main-nav" aria-label="主导航">
          <a class="active" href="../index.html">课程</a>
          <a href="../practice/index.html">互动练习</a>
          <a href="../../experiments/index.html">可视化实验</a>
          <a href="../../account/profile.html">学习情况</a>
          <a href="../../members/index.html">关于我们</a>
        </nav>
        <div class="account-actions">
          <a
            class="button button-primary"
            id="back-to-login"
            href="../../account/index1.html"
            >回到登录页面</a
          >
          <a
            class="account-user"
            id="account-user"
            href="../../account/profile.html"
            data-profile-href="../../account/profile.html"
            hidden
            >我的账号</a
          >
        </div>
      </div>
    </header>

    <main class="courses-page knowledge-tree-page">
      <div class="courses-shell">
        <p class="courses-breadcrumb">
          <a href="../index.html">课程中心</a> /
          <a href="index.html">基础知识</a> / 知识树
        </p>

        <section class="knowledge-tree-panel" aria-labelledby="knowledge-tree-title">
          <div class="knowledge-tree-heading">
            <div>
              <p class="eyebrow">知识树</p>
              <h2 id="knowledge-tree-title">
                一棵树连接 <span id="tree-chapter-count">13</span> 个章节与
                <span id="tree-topic-count">80</span> 个知识点
              </h2>
              <p>
                点击枝条选择章节，点击叶片查看对应知识点，并进入该知识点的章节详情页。
              </p>
            </div>
            <div class="knowledge-tree-legend" aria-label="知识树图例">
              <span><i class="legend-trunk"></i>知识体系</span>
              <span><i class="legend-branch"></i>章节</span>
              <span><i class="legend-leaf"></i>知识点</span>
            </div>
          </div>

          <div
            class="knowledge-tree-tabs"
            id="tree-chapter-tabs"
            aria-label="章节快捷导航"
          ></div>

          <div class="knowledge-tree-canvas" id="knowledge-tree-canvas">
            <svg
              class="knowledge-tree-svg"
              id="knowledge-tree"
              viewBox="0 0 1400 900"
              role="img"
              aria-labelledby="knowledge-tree-svg-title knowledge-tree-svg-desc"
            >
              <title id="knowledge-tree-svg-title">机器学习基础知识树</title>
              <desc id="knowledge-tree-svg-desc">
                树干连接十三个章节，每个章节枝条上的叶片代表相应知识点。
              </desc>
            </svg>
            <div
              class="tree-tooltip"
              id="tree-tooltip"
              role="tooltip"
              aria-hidden="true"
            ></div>
          </div>

          <div class="knowledge-tree-inspector" id="knowledge-tree-inspector"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <a class="brand footer-brand" href="../../index.html">
            <span class="brand-mark">ML</span>
            <span>ML Learn</span>
          </a>
          <p>让机器学习变得清晰、直观、有趣。</p>
        </div>
        <div class="footer-links">
          <a href="../../index.html#home">首页</a>
          <a href="../index.html">课程</a>
          <a href="index.html">基础知识</a>
          <a href="../practice/index.html">互动练习</a>
          <a href="../../members/index.html">关于</a>
        </div>
        <p class="copyright">© 2026 ML Learn</p>
      </div>
    </footer>

    <script src="../../account/auth.js"></script>
    <script src="../../account/session.js"></script>
    <script src="../data/basics.js"></script>
    <script src="tree.js"></script>
  </body>
</html>
