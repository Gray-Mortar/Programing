<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ML Learn 对话式注册登录入口" />
    <title>欢迎进入 ML Learn</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./auth.js"></script>
    <script>
      if (window.MLAuth && window.MLAuth.getCurrentUser()) {
        window.location.replace("../index.html");
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-layout" aria-labelledby="pageTitle">
        <header class="topbar">
          <a class="brand" href="#pageTitle">
            <span class="brand-mark">ML</span>
            <span>Learning Club</span>
          </a>
          <span class="secure-status">
            <i></i> 账号数据仅保存在当前浏览器
          </span>
        </header>

        <div class="chat-stage">
          <aside class="bot-illustration" aria-label="学习伙伴机器人">
            <img
              src="./微信图片_20260910193624_696_21.png"
              alt="学习伙伴机器人"
            />
          </aside>
          <div class="chat-intro">
            <p class="club-kicker">YOUR LEARNING COMPANION</p>
            <h1 id="pageTitle">先聊几句，<em>马上出发。</em></h1>
            <p>不用填写复杂表单，我会一步一步帮你完成登录或加入。</p>
          </div>
          <div
            class="conversation"
            id="conversation"
            aria-live="polite"
            aria-label="登录助手对话记录"
          ></div>
          <aside class="bot-profile" aria-label="学习伙伴信息">
            <div class="bot-avatar">
              <img
                src="./微信图片_20260910210947_730_2.png"
                alt="学习伙伴"
              />
            </div>
            <strong>小 ML</strong><span>在线陪伴</span>
          </aside>
        </div>

        <form class="composer" id="authForm" novalidate>
          <div class="composer-label">
            <span id="composerHint">点击选项，或直接输入</span><kbd>Enter</kbd>
          </div>
          <div class="composer-row">
            <input
              id="chatInput"
              name="answer"
              type="text"
              autocomplete="off"
              placeholder="输入你的回答..."
              aria-label="输入回答"
            />
            <button
              class="send-button"
              type="submit"
              aria-label="发送回答"
              title="发送回答"
            >
              ↑
            </button>
          </div>
          <div class="quick-actions" id="quickActions"></div>
        </form>
        <button class="restart-button" id="restartButton" type="button">
          重新开始
        </button>
      </section>
    </main>

    <section
      class="learning-overlay"
      id="learningOverlay"
      hidden
      aria-labelledby="learningTitle"
    >
      <div class="loading-panel" id="loadingPanel">
        <div class="loading-orbit" aria-hidden="true"><span></span><b>ML</b></div>
        <p class="club-kicker">PREPARING YOUR SPACE</p>
        <h2 id="loadingTitle">正在准备你的学习空间</h2>
        <p class="loading-copy">正在同步课程、练习和你的学习进度</p>
        <div class="loading-track" aria-hidden="true"><span></span></div>
      </div>
      <div class="ready-panel" id="readyPanel" hidden>
        <div class="ready-check" aria-hidden="true">✓</div>
        <p class="club-kicker">YOUR NEXT CHAPTER</p>
        <h2 id="learningTitle">准备好了，开始学习吧</h2>
        <p>你的学习空间已经就位，下一步由你来决定。</p>
        <button class="start-learning" id="startLearning" type="button">
          开始学习 <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
