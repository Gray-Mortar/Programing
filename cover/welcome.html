<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎来到机器学习网站 - ML Learn</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: linear-gradient(160deg, #f7f5ff 0%, #ffffff 45%, #eee9ff 100%);
      position: relative;
    }
    /* 背景装饰光晕 */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(109,75,209,0.1) 0%, transparent 70%);
      border-radius: 50%;
      top: -150px;
      left: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(91,60,196,0.08) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -120px;
      right: -120px;
      pointer-events: none;
    }

    /* 中央欢迎内容 */
    .welcome-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      text-align: center;
      z-index: 2;
      padding: 20px;
    }
    .welcome-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .welcome-logo-mark {
      display: grid;
      width: 68px;
      height: 68px;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #6d4bd1, #5b3cc4);
      border-radius: 16px;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(109,75,209,0.3);
    }
    .welcome-logo-text {
      font-size: 32px;
      font-weight: 700;
      color: #5b3cc4;
    }
    .welcome-title {
      font-size: 82px;
      font-weight: 800;
      color: #5b3cc4;
      margin-bottom: 24px;
      letter-spacing: 6px;
      line-height: 1.3;
    }
    .welcome-title span {
      background: linear-gradient(135deg, #6d4bd1, #9b7fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .welcome-subtitle {
      font-size: 28px;
      color: #6d687b;
      margin-bottom: 56px;
      letter-spacing: 4px;
    }
    .welcome-enter-btn {
      display: inline-block;
      padding: 22px 68px;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6d4bd1 0%, #5b3cc4 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(109,75,209,0.35);
      transition: transform 0.3s, box-shadow 0.3s;
      letter-spacing: 4px;
    }
    .welcome-enter-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(109,75,209,0.45);
    }
    .welcome-enter-btn:active {
      transform: translateY(-1px);
    }

    /* 右下角探出的机器人 */
    .robot-peek {
      --iris-peek-height: 161px;
      position: fixed;
      display: block;
      right: -18px;
      bottom: 0;
      width: 340px;
      height: min(72vh, 560px);
      color: inherit;
      z-index: 3;
    }
    .cover-iris {
      --iris-width: 100%;
      --iris-height: 161px;
      --iris-rise-height: 100%;
      --iris-standing-width: 68%;
      --iris-left: 0;
      --iris-z-index: 1;
    }
    /* 机器人对话气泡 */
    .robot-bubble {
      position: absolute;
      top: auto;
      bottom: calc(var(--iris-peek-height) + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border: 2.5px solid #6d4bd1;
      border-radius: 14px;
      padding: 8px 15px;
      font-size: 14px;
      font-weight: 700;
      color: #5b3cc4;
      box-shadow: 0 6px 16px rgba(109,75,209,0.2);
      white-space: nowrap;
      cursor: default;
      z-index: 3;
      animation: bubble-float 2.5s ease-in-out infinite;
    }
    .robot-peek.is-revealed .robot-bubble {
      top: 18px;
      bottom: auto;
      padding: 10px 18px;
      font-size: 16px;
    }
    .robot-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid #6d4bd1;
    }
    .robot-bubble::before {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #fff;
      z-index: 1;
    }
    @keyframes bubble-float {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -8px); }
    }

    /* 页脚 */
    .welcome-footer {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: #a09bb0;
      z-index: 1;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .welcome-title {
        font-size: 52px;
        letter-spacing: 4px;
      }
      .welcome-subtitle {
        font-size: 24px;
        margin-bottom: 40px;
      }
      .welcome-enter-btn {
        padding: 18px 52px;
        font-size: 22px;
      }
      .robot-peek {
        --iris-peek-height: 142px;
        right: -12px;
        width: 300px;
        height: min(68vh, 480px);
      }
      .cover-iris {
        --iris-height: 142px;
        --iris-standing-width: 72%;
      }
      .robot-bubble {
        font-size: 13px;
        padding: 7px 13px;
      }
    }

    @media (max-width: 480px) {
      .welcome-title {
        font-size: 40px;
        letter-spacing: 3px;
      }
      .welcome-subtitle {
        font-size: 20px;
      }
      .welcome-enter-btn {
        padding: 16px 40px;
        font-size: 20px;
      }
      .robot-peek {
        --iris-peek-height: 104px;
        right: -8px;
        width: 220px;
        height: min(58vh, 360px);
      }
      .cover-iris {
        --iris-height: 104px;
        --iris-standing-width: 74%;
      }
      .robot-bubble {
        font-size: 12px;
        padding: 6px 10px;
      }
      .robot-peek.is-revealed .robot-bubble {
        top: 10px;
        padding: 7px 12px;
        font-size: 12px;
      }
      .welcome-center {
        transform: translate(-50%, -50%);
      }
    }
  </style>
    <link rel="preload" href="../bgm/Kyle%20Xian%20-%20%E4%BA%91%E9%9B%80.mp3" as="audio" type="audio/mpeg" data-site-bgm-preload />
    <script src="../components/site-bgm.js" defer></script>
</head>
<body>
  <!-- 中央欢迎内容 -->
  <div class="welcome-center">
    <div class="welcome-logo">
      <span class="welcome-logo-mark">ML</span>
      <span class="welcome-logo-text">ML Learn</span>
    </div>
    <h1 class="welcome-title">欢迎来到<br /><span>机器学习网站</span></h1>
    <p class="welcome-subtitle">在互动中理解机器学习 · 开启你的学习之旅</p>
  </div>

  <!-- 右下角 Iris：提示框负责唤出，Iris 负责进入登录与注册 -->
  <div class="robot-peek" id="cover-iris-stage">
    <div class="robot-bubble" id="iris-invitation" aria-live="polite">
      移到这里，叫醒 Iris～
    </div>
    <iris-peek
      id="cover-enter"
      class="cover-iris"
      placement="hero"
      animated
      active
      rise
      standing-pose="wave"
      accessible-label="点击 Iris 进入登录与注册"
      title="点击 Iris 进入登录与注册"
    ></iris-peek>
  </div>

  <div class="welcome-footer">© 2026 ML Learn · 机器学习互动课堂</div>

  <script src="../components/iris-peek.js"></script>
  <script>
    const coverIris = document.getElementById("cover-enter");
    const irisInvitation = document.getElementById("iris-invitation");
    const irisStage = document.getElementById("cover-iris-stage");
    let revealTimer = 0;
    let irisRevealed = false;

    function revealIris() {
      if (irisRevealed) return;
      irisRevealed = true;
      irisStage.classList.add("is-revealed");
      coverIris.setAttribute("standing", "");
      irisInvitation.textContent = "点击 Iris 进入～";
    }

    irisInvitation.addEventListener("mouseenter", function () {
      revealTimer = window.setTimeout(revealIris, 320);
    });

    irisInvitation.addEventListener("mouseleave", function () {
      window.clearTimeout(revealTimer);
    });

    irisInvitation.addEventListener("click", revealIris);
    coverIris.addEventListener("focusin", revealIris);

    coverIris.addEventListener("iris-activate", function () {
      window.sessionStorage.setItem("ml-cover-entered", "1");
      window.location.href = "../account/index1.html";
    });
  </script>
</body>
</html>
