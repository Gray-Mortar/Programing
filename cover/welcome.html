<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎来到机器学习网站 - ML Learn</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: linear-gradient(160deg, #f7f5ff 0%, #ffffff 45%, #eee9ff 100%);
      position: relative;
    }
    /* 背景装饰光晕 */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(109,75,209,0.1) 0%, transparent 70%);
      border-radius: 50%;
      top: -150px;
      left: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(91,60,196,0.08) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -120px;
      right: -120px;
      pointer-events: none;
    }

    /* 中央欢迎内容 */
    .welcome-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      text-align: center;
      z-index: 2;
      padding: 20px;
    }
    .welcome-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .welcome-logo-mark {
      display: grid;
      width: 68px;
      height: 68px;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #6d4bd1, #5b3cc4);
      border-radius: 16px;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(109,75,209,0.3);
    }
    .welcome-logo-text {
      font-size: 32px;
      font-weight: 700;
      color: #5b3cc4;
    }
    .welcome-title {
      font-size: 82px;
      font-weight: 800;
      color: #5b3cc4;
      margin-bottom: 24px;
      letter-spacing: 6px;
      line-height: 1.3;
    }
    .welcome-title span {
      background: linear-gradient(135deg, #6d4bd1, #9b7fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .welcome-subtitle {
      font-size: 28px;
      color: #6d687b;
      margin-bottom: 56px;
      letter-spacing: 4px;
    }
    .welcome-enter-btn {
      display: inline-block;
      padding: 22px 68px;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6d4bd1 0%, #5b3cc4 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(109,75,209,0.35);
      transition: transform 0.3s, box-shadow 0.3s;
      letter-spacing: 4px;
    }
    .welcome-enter-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(109,75,209,0.45);
    }
    .welcome-enter-btn:active {
      transform: translateY(-1px);
    }

    /* 右下角探出的机器人 */
    .robot-peek {
      position: fixed;
      display: block;
      right: -18px;
      bottom: 0;
      width: 340px;
      height: min(72vh, 560px);
      color: inherit;
      cursor: pointer;
      z-index: 3;
      text-decoration: none;
      transition: transform 0.4s ease;
    }
    .robot-peek:hover {
      transform: translateY(-12px);
    }
    .cover-iris {
      --iris-width: 100%;
      --iris-height: 161px;
      --iris-rise-height: 100%;
      --iris-standing-width: 68%;
      --iris-left: 0;
      --iris-z-index: 1;
    }
    .robot-peek:focus-visible {
      outline: 3px solid #6d4bd1;
      outline-offset: -8px;
      border-radius: 24px;
    }
    /* 机器人对话气泡 */
    .robot-bubble {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border: 2.5px solid #6d4bd1;
      border-radius: 18px;
      padding: 12px 24px;
      font-size: 17px;
      font-weight: 700;
      color: #5b3cc4;
      box-shadow: 0 6px 16px rgba(109,75,209,0.2);
      white-space: nowrap;
      animation: bubble-float 2.5s ease-in-out infinite;
    }
    .robot-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid #6d4bd1;
    }
    .robot-bubble::before {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #fff;
      z-index: 1;
    }
    @keyframes bubble-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* 页脚 */
    .welcome-footer {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: #a09bb0;
      z-index: 1;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .welcome-title {
        font-size: 52px;
        letter-spacing: 4px;
      }
      .welcome-subtitle {
        font-size: 24px;
        margin-bottom: 40px;
      }
      .welcome-enter-btn {
        padding: 18px 52px;
        font-size: 22px;
      }
      .robot-peek {
        right: -12px;
        width: 300px;
        height: min(68vh, 480px);
      }
      .cover-iris {
        --iris-height: 142px;
        --iris-standing-width: 72%;
      }
      .robot-bubble {
        font-size: 14px;
        padding: 10px 16px;
      }
    }

    @media (max-width: 480px) {
      .welcome-title {
        font-size: 40px;
        letter-spacing: 3px;
      }
      .welcome-subtitle {
        font-size: 20px;
      }
      .welcome-enter-btn {
        padding: 16px 40px;
        font-size: 20px;
      }
      .robot-peek {
        right: -8px;
        width: 220px;
        height: min(58vh, 360px);
      }
      .cover-iris {
        --iris-height: 104px;
        --iris-standing-width: 74%;
      }
      .robot-bubble {
        font-size: 12px;
        padding: 8px 12px;
      }
      .welcome-center {
        transform: translate(-50%, -50%);
      }
    }
  </style>
</head>
<body>
  <!-- 中央欢迎内容 -->
  <div class="welcome-center">
    <div class="welcome-logo">
      <span class="welcome-logo-mark">ML</span>
      <span class="welcome-logo-text">ML Learn</span>
    </div>
    <h1 class="welcome-title">欢迎来到<br /><span>机器学习网站</span></h1>
    <p class="welcome-subtitle">在互动中理解机器学习 · 开启你的学习之旅</p>
  </div>

  <!-- 右下角探出的机器人 -->
  <a
    class="robot-peek"
    id="cover-enter"
    href="../account/index1.html"
    title="点击进入登录与注册"
    aria-label="点击 Iris 进入登录与注册"
  >
    <div class="robot-bubble">点我进入～</div>
    <iris-peek
      class="cover-iris"
      placement="hero"
      passive
      animated
      active
      rise
      standing-pose="wave"
    ></iris-peek>
  </a>

  <div class="welcome-footer">© 2026 ML Learn · 机器学习互动课堂</div>

  <script src="../components/iris-peek.js"></script>
  <script>
    const coverEnter = document.getElementById("cover-enter");
    const coverIris = coverEnter.querySelector(".cover-iris");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    window.setTimeout(() => {
      coverIris.setAttribute("standing", "");
    }, reduceMotion ? 0 : 520);

    coverEnter.addEventListener("click", function () {
      window.sessionStorage.setItem("ml-cover-entered", "1");
    });
  </script>
</body>
</html>
