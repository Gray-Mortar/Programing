<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ML Learn 用户注册">
    <title>注册 - ML Learn</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="account.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="../index.html" aria-label="返回首页">
                <span class="brand-mark">ML</span>
                <span>ML Learn</span>
            </a>
            <nav class="main-nav" aria-label="主导航">
                

                <a href="../courses/index.html">课程</a>
                <a href="../courses/practice/index.html">互动练习</a>
                <a href="../experiments/index.html">可视化实验</a>
                <a href="../account/profile.html">学习情况</a>
                <a href="../members/index.html">关于我们</a>
            </nav>
            <div class="account-actions">
                <a class="button button-secondary" href="login.html">登录</a>
                <a class="button button-primary" href="register.html">注册</a>
                <a class="account-user" id="account-user" href="profile.html" data-profile-href="profile.html" hidden>我的账号</a>
            </div>
        </div>
    </header>

    <main class="account-page">
        <div class="account-shell">
            <section class="account-card" aria-labelledby="register-title">
                <p class="eyebrow">创建账号</p>
                <h1 id="register-title">注册 ML Learn</h1>
                <p class="account-intro">设置用户名和密码，用于保存个人资料。</p>

                <form class="auth-form" id="register-form" novalidate>
                    <div class="form-group">
                        <label for="register-username">用户名 <span class="required" aria-hidden="true">*</span></label>
                        <input class="form-control" id="register-username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required>
                        <p class="form-hint">用于登录，注册后不可重复。</p>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="register-password">密码 <span class="required" aria-hidden="true">*</span></label>
                            <input class="form-control" id="register-password" name="password" type="password" autocomplete="new-password" placeholder="请输入密码" required>
                        </div>
                        <div class="form-group">
                            <label for="register-confirm">确认密码 <span class="required" aria-hidden="true">*</span></label>
                            <input class="form-control" id="register-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="再次输入密码" required>
                        </div>
                    </div>

                    <p class="auth-message" id="register-message" role="status" aria-live="polite"></p>

                    <div class="auth-actions">
                        <button class="button button-primary button-large" type="submit">注册并去登录</button>
                    </div>

                    <p class="auth-switch">已有账号？<a href="login.html">直接登录</a></p>
                </form>

                <p class="back-home"><a href="../index.html">返回网站首页</a></p>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div>
                <a class="brand footer-brand" href="../index.html">
                    <span class="brand-mark">ML</span>
                    <span>ML Learn</span>
                </a>
                <p>让机器学习变得清晰、直观、有趣。</p>
            </div>
            <div class="footer-links">
                <a href="../index.html#home">首页</a>
                <a href="../index.html#courses">课程</a>
                <a href="../members/index.html">关于</a>
            </div>
            <p class="copyright">© 2026 ML Learn</p>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script>
        (function () {
            const form = document.getElementById("register-form");
            const message = document.getElementById("register-message");

            form.addEventListener("submit", function (event) {
                event.preventDefault();
                message.className = "auth-message";
                message.textContent = "";

                const username = document.getElementById("register-username").value.trim();
                const password = document.getElementById("register-password").value;
                const confirm = document.getElementById("register-confirm").value;

                if (!username || !password || !confirm) {
                    message.classList.add("is-error");
                    message.textContent = "请填写用户名和密码。";
                    return;
                }

                if (password !== confirm) {
                    message.classList.add("is-error");
                    message.textContent = "两次输入的密码不一致。";
                    return;
                }

                const result = window.MLAuth.register({
                    username: username,
                    password: password
                });

                if (!result.ok) {
                    message.classList.add("is-error");
                    message.textContent = result.message;
                    return;
                }

                message.classList.add("is-success");
                message.textContent = "注册成功，正在跳转到登录页...";
                window.setTimeout(function () {
                    window.location.href = "login.html?registered=1";
                }, 600);
            });
        })();
    </script>
</body>
</html>
